[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-notion-sync"
version = "0.1.0"
description = "Copy personal Google Classroom assignments into Notion without overwriting notes."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
classroom-sync = "tracker.sync:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["tracker*"]
